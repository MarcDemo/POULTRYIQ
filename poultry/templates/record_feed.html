{% extends "wbase.html" %}
{% block content %}

<div class="container mt-4">

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header" style="background: linear-gradient(135deg, #ff9800 0%, #fb8c00 100%);">
                    <i class="bi bi-bag-fill me-2"></i>Record Feed
                </div>

                <div class="card-body">

                    <form method="POST" novalidate>
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="feed_type" class="form-label">
                                <i class="bi bi-bag me-1"></i>Feed Type
                            </label>
                            <select id="feed_type" name="feed_type" class="form-select">
                                <option>Starter</option>
                                <option>Grower</option>
                                <option>Layer Mash</option>
                                <option>Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="quantity" class="form-label">
                                <i class="bi bi-box me-1"></i>Quantity Given (kg)
                            </label>
                            <input type="number" id="quantity" step="0.1" name="quantity" class="form-control" placeholder="0.0" required min="0">
                        </div>

                        <div class="mb-3">
                            <label for="time_given" class="form-label">
                                <i class="bi bi-clock me-1"></i>Time Given
                            </label>
                            <input type="time" id="time_given" name="time_given" class="form-control">
                            <small class="form-text text-muted">Leave empty for current time</small>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-warning">
                                <i class="bi bi-check-circle me-2"></i>Save Feed Record
                            </button>
                        </div>

                    </form>
        </div>
            </div>
        </div>
    </div>

</div>

        </div>
    </div>

</div>

{% endblock %}
