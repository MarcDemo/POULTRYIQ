{% extends "wbase.html" %}
{% block content %}

<div class="container mt-4">

    <div class="card shadow-sm">
        <div class="card-header bg-success text-white">
            Cleaning Routine - House A <!-- /* Replace with dynamic house name */ -->
        </div>

        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" name="cleaned">
                    <label class="form-check-label">
                        House Cleaned
                    </label>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" name="disinfected">
                    <label class="form-check-label">
                        Disinfection Done
                    </label>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" name="water_changed">
                    <label class="form-check-label">
                        Water Changed
                    </label>
                </div>

                <div class="mb-3">
                    <label>Comments</label>
                    <textarea name="notes" class="form-control"></textarea>
                </div>

                <button type="submit" class="btn btn-success w-100">
                    Save Cleaning Record
                </button>

            </form>

        </div>
    </div>

</div>

{% endblock %}
