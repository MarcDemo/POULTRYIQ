{% extends 'base.html' %}
{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
            <i class="bi bi-egg me-2"></i>Birds Inventory
        </h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addBirdModal">
            <i class="bi bi-plus-circle me-2"></i>Add Batch
        </button>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>House</th>
                            <th>Type</th>
                            <th>Quantity</th>
                            <th>Age (weeks)</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><span class="badge bg-info">House A</span></td>
                            <td>
                                <i class="bi bi-egg me-2"></i>Layers
                            </td>
                            <td><strong>1,800</strong></td>
                            <td>24</td>
                            <td><span class="badge bg-success"><i class="bi bi-check-circle me-1"></i>Healthy</span></td>
                            <td>
                                <button class="btn btn-sm btn-outline-warning" title="Edit">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" title="Delete">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

{% endblock %}
