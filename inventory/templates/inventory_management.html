{% extends 'base.html' %}
{% block content %}

<div class="container-fluid">

<h3 class="mb-4">
    <i class="bi bi-boxes me-2"></i>Inventory Management
</h3>

<div class="row g-4">

<!-- ADD ITEM -->
<div class="col-lg-4">
<div class="card">
<div class="card-header">
    <i class="bi bi-plus-circle me-2"></i>Add Item
</div>

<div class="card-body">
<form method="POST" novalidate>
{% csrf_token %}

<div class="mb-3">
    <label for="item" class="form-label">
        <i class="bi bi-box me-1"></i>Item Name
    </label>
    <input class="form-control" id="item" name="item" placeholder="e.g., Layer Feed" required>
</div>

<div class="mb-3">
    <label for="quantity" class="form-label">
        <i class="bi bi-collection me-1"></i>Quantity
    </label>
    <input class="form-control" id="quantity" name="quantity" placeholder="0" type="number" required min="0">
</div>

<div class="mb-3">
    <label for="unit" class="form-label">
        <i class="bi bi-rulers me-1"></i>Unit
    </label>
    <input class="form-control" id="unit" name="unit" placeholder="kg, trays, liters, etc">
</div>

<div class="d-grid">
    <button class="btn btn-success" type="submit">
        <i class="bi bi-check-circle me-2"></i>Save
    </button>
</div>

</form>
</div>
</div>
</div>

<!-- STOCK LIST -->
<div class="col-lg-8">
<div class="card">
<div class="card-header">
    <i class="bi bi-table me-2"></i>Current Stock
</div>
<div class="card-body">

<div class="table-responsive">
<table class="table table-hover">
<thead>
<tr>
<th>Item</th>
<th>Quantity</th>
<th>Unit</th>
<th>Status</th>
</tr>
</thead>

<tbody>
{% for i in inventory %}
<tr>
<td>
    <i class="bi bi-box-seam me-2"></i>{{ i.item }}
</td>
<td><strong>{{ i.quantity }}</strong></td>
<td>{{ i.unit }}</td>
<td>
{% if i.quantity < 50 %}
<span class="badge bg-danger">Low</span>
{% else %}
<span class="badge bg-success">OK</span>
{% endif %}
</td>
</tr>
{% endfor %}
</tbody>

</table>

</div>
</div>
</div>

</div>

</div>

{% endblock %}
