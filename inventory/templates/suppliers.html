{% extends 'base.html' %}
{% block content %}

<div class="container-fluid">

<div class="page-header-row mb-4">
<h3>
    <i class="bi bi-shop me-2"></i>Suppliers
</h3>
</div>

<div class="row g-4">

<!-- FORM -->
<div class="col-lg-4">
<div class="card">
<div class="card-header">
    <i class="bi bi-plus-circle me-2"></i>Add Supplier
</div>

<div class="card-body">
<form method="POST" novalidate>
{% csrf_token %}

<div class="mb-3">
    <label for="name" class="form-label">
        <i class="bi bi-person me-1"></i>Supplier Name
    </label>
    <input class="form-control" id="name" name="name" placeholder="Company name" required>
</div>

<div class="mb-3">
    <label for="phone" class="form-label">
        <i class="bi bi-telephone me-1"></i>Phone
    </label>
    <input class="form-control" id="phone" name="phone" placeholder="+256..." required>
</div>

<div class="mb-3">
    <label for="location" class="form-label">
        <i class="bi bi-geo-alt me-1"></i>Location
    </label>
    <input class="form-control" id="location" name="location" placeholder="City or address">
</div>

<div class="mb-3">
    <label for="product" class="form-label">
        <i class="bi bi-box me-1"></i>Product Supplied
    </label>
    <input class="form-control" id="product" name="product" placeholder="e.g., Feed, Medication">
</div>

<div class="d-grid">
    <button class="btn btn-primary" type="submit">
        <i class="bi bi-check-circle me-2"></i>Save
    </button>
</div>

</form>
</div>
</div>
</div>

<!-- LIST -->
<div class="col-lg-8">
<div class="card">
<div class="card-header">
    <i class="bi bi-table me-2"></i>Supplier List
</div>
<div class="card-body">

<div class="table-responsive">
<table class="table table-hover">
<thead>
<tr>
<th>Name</th>
<th>Phone</th>
<th>Location</th>
<th>Product</th>
<th>Actions</th>
</tr>
</thead>

<tbody>

<tr>
<td>Biyinzika</td>
<td>0700123456</td>
<td>Kampala</td>
<td>Chicken Feed</td>

</tr>

</tbody>

</table>

</div>
</div>
</div>

</div>

</div>

{% endblock %}
