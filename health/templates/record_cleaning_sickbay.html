{% extends "base.html" %}
{% block extra_css %}
<style>
.sickbay-banner{background:linear-gradient(90deg,rgba(220,53,69,0.06),rgba(248,113,113,0.03));border-left:4px solid rgba(220,53,69,0.18);padding:12px 16px;border-radius:10px;margin-bottom:12px;gap:12px}
.s-badge{width:42px;height:42px;border-radius:8px;background:linear-gradient(180deg,#fff,#ffd6d6);color:#c82333;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;box-shadow:0 6px 18px rgba(200,40,50,0.12);animation:sBadgePulse 1.8s ease-in-out infinite}
@keyframes sBadgePulse{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}

/* Hide global sidebar for focused sickbay pages */
.sidebar, .sidebar-overlay, .mobile-topbar [data-sidebar-toggle] { display: none !important; }
.wrapper { margin-left: 0 !important; }
.main-content { padding-left: 0 !important; }
.sickbay-back { margin-left: auto; }

.card-header { display:flex; align-items:center; justify-content:space-between; }
@media (max-width: 767px) {
    .sickbay-banner { flex-direction:column; align-items:flex-start }
    .sickbay-back { margin-left: 0; margin-top:8px }
}
</style>
{% endblock %}
{% block content %}
<div class="container mt-4">
    <div class="sickbay-banner d-flex align-items-center justify-content-between">
        <div class="s-badge me-3">+</div>
        <div>
            <h4 class="mb-0">Cleaning Routine — Sickbay</h4>
            <small class="text-muted">Only records for today are accepted</small>
        </div>
        <a href="{% url 'sickbay' %}" class="btn btn-outline-secondary btn-sm sickbay-back"><i class="bi bi-arrow-left me-1"></i>Back to sickbay dashboard</a>
    </div>

    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card shadow">
                <div class="card-header" style="background: linear-gradient(135deg, #28a745 0%, #20c997 100%);">
                    <i class="bi bi-broom me-2"></i>Cleaning Routine (Sickbay)
                </div>

                <div class="card-body">

                    <form method="POST" novalidate enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="batch" class="form-label">
                                <i class="bi bi-house-door me-1"></i>Batch
                            </label>
                            <select id="batch" name="batch" class="form-select" required>
                                <option value="">-- Select batch --</option>
                                {% for batch in batches %}
                                <option value="{{ batch.pk }}">{{ batch.house.name|default:batch.house.house_code }} - {{ batch.batch_code }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="record_date" class="form-label">
                                <i class="bi bi-calendar me-1"></i>Date
                            </label>
                            <input type="date" id="record_date" name="record_date" class="form-control" value="{{ today|date:'Y-m-d' }}" required>
                        </div>

                        <div class="mb-4">
                            <h6 class="mb-3">Mark tasks completed:</h6>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="cleaned" name="cleaned">
                                <label class="form-check-label" for="cleaned">
                                    <i class="bi bi-check-circle me-2"></i>House Cleaned
                                </label>
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="disinfected" name="disinfected">
                                <label class="form-check-label" for="disinfected">
                                    <i class="bi bi-shield-check me-2"></i>Disinfection Done
                                </label>
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="water_changed" name="water_changed">
                                <label class="form-check-label" for="water_changed">
                                    <i class="bi bi-droplet me-2"></i>Water Changed
                                </label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="notes" class="form-label">
                                <i class="bi bi-chat-left-text me-1"></i>Comments
                            </label>
                            <textarea id="notes" name="notes" class="form-control" placeholder="Add any notes..." rows="4"></textarea>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-circle me-2"></i>Save Cleaning Record
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>

        
    </div>

</div>

{% endblock %}
