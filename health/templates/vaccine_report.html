{% extends 'base.html' %}
{% block content %}

<div class="container-fluid">

<h3 class="mb-4">Vaccination Report</h3>

<!-- FILTER -->
<div class="card mb-3">
<div class="card-body">

<form class="row g-3">

<div class="col-md-3">
<input type="date" class="form-control" name="start">
</div>

<div class="col-md-3">
<input type="date" class="form-control" name="end">
</div>

<div class="col-md-3">
<select class="form-control" name="status">
<option value="">All</option>
<option value="scheduled">Scheduled</option>
<option value="done">Completed</option>
</select>
</div>

<div class="col-md-3">
<button class="btn btn-primary w-100">Filter</button>
</div>

</form>

</div>
</div>

<!-- TABLE -->
<div class="card">
<div class="card-body">

<table class="table table-striped">

<thead>
<tr>
<th>Date</th>
<th>House</th>
<th>Vaccine</th>
<th>Status</th>
</tr>
</thead>

<tbody>
{% for v in vaccinations %}
<tr>
<td>{{ v.date }}</td>
<td>{{ v.house }}</td>
<td>{{ v.vaccine }}</td>
<td>{{ v.status }}</td>
</tr>
{% endfor %}
</tbody>

</table>

</div>
</div>

</div>

{% endblock %}
