{% extends "base.html" %}
{% block extra_css %}
<style>
.sickbay-banner{background:linear-gradient(90deg,rgba(220,53,69,0.06),rgba(248,113,113,0.03));border-left:4px solid rgba(220,53,69,0.18);padding:12px 16px;border-radius:10px;margin-bottom:12px;gap:12px}
.s-badge{width:42px;height:42px;border-radius:8px;background:linear-gradient(180deg,#fff,#ffd6d6);color:#c82333;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;box-shadow:0 6px 18px rgba(200,40,50,0.12);animation:sBadgePulse 1.8s ease-in-out infinite}
@keyframes sBadgePulse{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}

/* Hide global sidebar for focused sickbay pages */
.sidebar, .sidebar-overlay, .mobile-topbar [data-sidebar-toggle] { display: none !important; }
.wrapper { margin-left: 0 !important; }
.main-content { padding-left: 0 !important; }
.sickbay-back { margin-left: auto; }
.sickbay-page-shell{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
.sickbay-side-nav{position:sticky;top:16px;background:#fff;border:1px solid rgba(220,53,69,.18);border-left:5px solid #dc3545;border-radius:10px;padding:16px;box-shadow:0 12px 28px rgba(15,23,42,.08)}
.sickbay-side-head{display:flex;gap:12px;align-items:center;padding-bottom:14px;border-bottom:1px solid #f1c2c7}
.sickbay-side-icon{width:46px;height:46px;border-radius:10px;background:#dc3545;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800}
.sickbay-mode{font-size:1rem;font-weight:800;text-transform:uppercase;color:#b02a37}
.sickbay-mode-sub{font-size:.9rem;color:#495057}
.sickbay-side-note{background:#fff5f5;border-radius:8px;padding:12px;margin:14px 0;color:#842029;font-size:.95rem}
.sickbay-side-note span{display:block;color:#6c2d34;margin-top:4px}
.sickbay-task-list{display:flex;flex-direction:column;gap:8px}
.sickbay-task-link{display:flex;align-items:center;gap:10px;padding:12px;border-radius:8px;color:#343a40;text-decoration:none;font-weight:700;background:#f8f9fa}
.sickbay-task-link:hover,.sickbay-task-link.active{background:#dc3545;color:#fff}
.sickbay-page-main{min-width:0}

.card-header { display:flex; align-items:center; justify-content:space-between; }
@media (max-width: 767px) {
    .sickbay-page-shell{grid-template-columns:1fr}
    .sickbay-side-nav{position:static}
    .sickbay-banner { flex-direction:column; align-items:flex-start }
    .sickbay-back { margin-left: 0; margin-top:8px }
}
</style>
{% endblock %}
{% block content %}
<div class="container mt-4">
    <div class="sickbay-page-shell">
    {% include "partials/sickbay_sidebar.html" %}
    <main class="sickbay-page-main">
    <div class="sickbay-banner d-flex align-items-center justify-content-between">
        <div class="s-badge me-3">+</div>
        <div>
            <h4 class="mb-0">Mortality Log — Sickbay</h4>
            <small class="text-muted">Only records for today are accepted</small>
        </div>
        <a href="{% url 'sickbay' %}" class="btn btn-outline-secondary btn-sm sickbay-back"><i class="bi bi-arrow-left me-1"></i>Back to sickbay dashboard</a>
    </div>

    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card shadow">
                <div class="card-header">
                    <i class="bi bi-exclamation-triangle me-2"></i>Log Mortality (Sickbay)
                </div>

                <div class="card-body">

                    <form method="POST" novalidate>
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="batch" class="form-label">
                                <i class="bi bi-house-door me-2"></i>Batch
                            </label>
                           <select id="sickness_report" name="sickness_report" class="form-select mb-2">
                                    <option value="">-- select sickbay case --</option>
                                    {% for case in sick_reports %}
                                    <option value="{{ case.pk }}" {% if case.batch %}data-batch="{{ case.batch.pk }}"{% endif %}>{{ case.house_label }} - {{ case.diagnosis_label }} ({{ case.case_label }})</option>
                                    {% endfor %}
                                </select>
                        </div>

                        <div class="mb-3">
                            <label for="record_date" class="form-label">
                                <i class="bi bi-calendar me-2"></i>Date
                            </label>
                            <input type="date" id="record_date" name="record_date" class="form-control" value="{{ today|date:'Y-m-d' }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="count" class="form-label">
                                <i class="bi bi-people me-2"></i>Number Dead
                            </label>
                            <input type="number" id="count" name="count" class="form-control" required min="1">
                        </div>

                        <div class="mb-3">
                            <label for="cause" class="form-label">
                                <i class="bi bi-list-ul me-2"></i>Cause
                            </label>
                            <select id="cause" name="cause" class="form-select">
                                <option value="">-- Select cause --</option>
                                {% for c in causes %}
                                <option value="{{ c.pk }}">{{ c.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="notes" class="form-label">
                                <i class="bi bi-chat-left-text me-2"></i>Notes
                            </label>
                            <textarea id="notes" name="notes" class="form-control" placeholder="Optional notes..." rows="3"></textarea>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-check-circle me-2"></i>Save Mortality Record
                            </button>
                        </div>

                    </form>

                </div>
            </div>
        </div>

        
    </div>
    </main>
    </div>

</div>

{% endblock %}
