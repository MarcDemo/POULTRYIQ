{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Supervisor Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body { margin:0; background:#f4f6f9; }

        .sidebar {
            width:250px;
            height:100vh;
            position:fixed;
            background:#0d6efd;
            padding-top:20px;
        }

        .sidebar h5 {
            color:white;
            text-align:center;
            margin-bottom:25px;
        }

        .sidebar a {
            display:block;
            color:white;
            padding:12px 20px;
            text-decoration:none;
            border-radius:6px;
            margin:5px 10px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background:white;
            color:#0d6efd;
            font-weight:600;
        }

        .main-content {
            margin-left:250px;
            padding:25px;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <h5>Supervisor : Mark</h5>

    <a href="{% url 'supdash' %}">🏠 Dashboard</a>
    <a href="{% url 'supapproval' %}">📋 Approvals</a>
   
    <a href="{% url 'sales' %}">📊 Make a sale</a>
    <a href="{% url 'orders' %}">📦Orders</a>
    <a href="{% url 'treatment' %}">💊 Treatment Records</a>
    <a href="{% url 'vaccination' %}">💉 Vaccination Scheduler</a>
    <a href="#">⚠ Incident Reports</a>
    <!-- <a href="#">👷 Worker Monitoring</a> -->

    <div class="text-center mt-4" >
        <a href="#" class="btn btn-light btn-sm" style="color: #0d6efd;">Logout</a>
    </div>
</div>

<div class="main-content">
    {% block content %}
    {% endblock %}
</div>
<script src="{% static 'sales/js/sales.js' %}"></script>
</body>
</html>
