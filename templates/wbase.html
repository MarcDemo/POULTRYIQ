<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Worker Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            background-color: #f4f6f9;
        }

        .sidebar {
            height: 100vh;
            width: 230px;
            background-color: #1f3c88;
            position: fixed;
            padding-top: 20px;
        }

        .sidebar h5 {
            color: #fff;
            text-align: center;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            padding: 12px 20px;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px 10px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background-color: #ffffff;
            color: #1f3c88;
            font-weight: 600;
        }

        .main-content {
            margin-left: 230px;
            padding: 25px;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h5>🐔 poultryIQ</h5>
        <h5>user: shanitah </h5> <!-- /* Replace with dynamic worker name */ -->

        <a href="{% url 'workersdash' %}"
           class="{% if request.resolver_match.url_name == 'workersdash' %}active{% endif %}">
            🏠 Dashboard
        </a>

        <a href="{% url 'record_egg' %}"
           class="{% if request.resolver_match.url_name == 'record_egg' %}active{% endif %}">
            🥚 Record Eggs
        </a>

        <a href="{% url 'record_feed' %}"
           class="{% if request.resolver_match.url_name == 'record_feed' %}active{% endif %}">
            🌾 Record Feed
        </a>

        <a href="{% url 'record_cleaning' %}"
           class="{% if request.resolver_match.url_name == 'record_cleaning' %}active{% endif %}">
            🧹 Cleaning Routine
        </a>

        <hr class="text-white mx-3">

        <div class="text-center mt-3" >
            <a href="#" class="btn btn-light btn-sm" style="color: #1f3c88;" >
                Logout
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
