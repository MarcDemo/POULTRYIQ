name: Verify and deploy production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Django and migration checks
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: testserver,localhost
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.NAMECHEAP_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/namecheap
          chmod 600 ~/.ssh/namecheap
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy main on Namecheap
        env:
          SSH_HOST: ${{ vars.NAMECHEAP_HOST }}
          SSH_PORT: ${{ vars.NAMECHEAP_PORT }}
          SSH_USER: ${{ vars.NAMECHEAP_USER }}
          APP_PATH: ${{ vars.NAMECHEAP_APP_PATH }}
          VENV_PYTHON: ${{ vars.NAMECHEAP_VENV_PYTHON }}
        run: |
          remote_command=$(printf 'bash -s -- %q %q' "$APP_PATH" "$VENV_PYTHON")
          ssh -i ~/.ssh/namecheap -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "$remote_command" < scripts/deploy_namecheap.sh
