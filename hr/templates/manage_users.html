{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="container-fluid">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h3>User Management</h3>

    <a href="{% url 'add_user' %}" class="btn btn-primary">
    + Add User
</a>
</div>

<!-- USERS TABLE -->

<div class="card">
<div class="card-body">

<table class="table table-hover table-bordered">

<thead class="table-light">
<tr>
<th>Full Name</th>
<th>Date Enrolled</th>
<th>Enrollment Number</th>
<th>Role</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>

<tbody>


<tr>

<td>Shanitah isa</td>
<td>25th may 2025</td>
<td>EN001</td>

<td>
<span class="badge bg-info">worker</span>
</td>

<td>

<span class="badge bg-success">Active</span>

<!-- <span class="badge bg-danger">Inactive</span> -->

</td>

<td>

<button class="btn btn-sm btn-warning edit-btn">
Edit
</button>

<a href="" class="btn btn-sm btn-secondary">
Remove user
</a>

</td>

</tr>


</tbody>

</table>

</div>
</div>

</div>

<!-- ADD USER MODAL -->

<div class="modal fade" id="addUserModal">
<div class="modal-dialog">
<div class="modal-content">



<div class="modal-body">

<form method="POST" action="#">
{% csrf_token %}

<div class="mb-3">
<label>Username</label>
<input type="text" class="form-control" name="username" required>
</div>

<div class="mb-3">
<label>Password</label>
<input type="password" class="form-control" name="password" required>
</div>

<div class="mb-3">
<label>Role</label>
<select class="form-control" name="role">
<option value="manager">Manager</option>
<option value="supervisor">Supervisor</option>
<option value="worker">Worker</option>
</select>
</div>

<button class="btn btn-success w-100">Create User</button>

</form>

</div>

</div>
</div>
</div>


<!-- EDIT USER MODAL -->

<div class="modal fade" id="editUserModal">
<div class="modal-dialog">
<div class="modal-content">

<div class="modal-header">
<h5>Edit User</h5>
</div>

<div class="modal-body">

<form method="POST" action="#">
{% csrf_token %}

<input type="hidden" name="user_id" id="edit_user_id">

<div class="mb-3">
<label>Username</label>
<input type="text" class="form-control" name="username" id="edit_username">
</div>

<div class="mb-3">
<label>Role</label>
<select class="form-control" name="role" id="edit_role">
<option value="manager">Manager</option>
<option value="supervisor">Supervisor</option>
<option value="worker">Worker</option>
</select>
</div>

<button class="btn btn-primary w-100">Save Changes</button>

</form>

</div>

</div>
</div>
</div>

<script src="{% static 'js/manage_users.js' %}"></script>

{% endblock %}
