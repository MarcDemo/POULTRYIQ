{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="container-fluid">

<div class="row justify-content-center">
<div class="col-lg-6">

<div class="card shadow">
<div class="card-header">
    <h4 class="mb-0">
        <i class="bi bi-person-plus me-2"></i>Add New User
    </h4>
</div>

<div class="card-body">

<form method="POST" novalidate>
{% csrf_token %}

<div class="mb-3">
<label for="username" class="form-label">
    <i class="bi bi-at me-1"></i>Username
</label>
<input type="text" id="username" class="form-control" name="username" placeholder="username123" required>
<small class="form-text text-muted">Must be unique</small>
</div>

<div class="mb-3">
<label for="full_name" class="form-label">
    <i class="bi bi-person me-1"></i>Full Name
</label>
<input type="text" id="full_name" class="form-control" name="full_name" placeholder="John Doe">
</div>

<div class="mb-3">
<label for="password" class="form-label">
    <i class="bi bi-lock me-1"></i>Password
</label>
<input type="password" id="password" class="form-control" name="password" placeholder="••••••••" required>
<small class="form-text text-muted">Minimum 8 characters</small>
</div>

<div class="mb-3">
<label for="confirm_password" class="form-label">
    <i class="bi bi-lock-fill me-1"></i>Confirm Password
</label>
<input type="password" id="confirm_password" class="form-control" name="confirm_password" placeholder="••••••••" required>
<small class="form-text text-muted">Must match password above</small>
</div>

<div class="mb-3">
<label for="salary" class="form-label">
    <i class="bi bi-cash-coin me-1"></i>Salary (UGX)
</label>
<input type="number" id="salary" class="form-control" name="salary" placeholder="0" required min="0" step="1000">
</div>

<div class="mb-3">
<label for="role" class="form-label">
    <i class="bi bi-briefcase me-1"></i>Role
</label>
<select id="role" class="form-select" name="role">
<option value="manager">Manager</option>
<option value="supervisor">Supervisor</option>
<option value="worker">Worker</option>
</select>
</div>

<div class="mb-3">
<label for="is_active" class="form-label">
    <i class="bi bi-toggle-on me-1"></i>Status
</label>
<select id="is_active" class="form-select" name="is_active">
<option value="True">Active</option>
<option value="False">Inactive</option>
</select>
</div>

<button class="btn btn-success w-100">
Create User
</button>

<a href="{% url 'manage_users' %}" class="btn btn-secondary w-100 mt-2">
Cancel
</a>

</form>

</div>
</div>

</div>
</div>

</div>

{% endblock %}
