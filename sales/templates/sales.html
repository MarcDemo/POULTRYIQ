{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="container-fluid">

<h2 class="mb-4">Make Sale</h2>

<div class="card shadow-sm">
	<div class="card-body">

		<form method="POST" id="salesForm">
			{% csrf_token %}

			<div class="row">

				<!-- CUSTOMER INFO -->
				<div class="col-md-6 mb-3">
					<label class="form-label">Customer Name</label>
					<input type="text" class="form-control" name="customer" required>
				</div>

				<div class="col-md-6 mb-3">
					<label class="form-label">Phone</label>
					<input type="text" class="form-control" name="phone">
				</div>

				<!-- PRODUCT -->
				<div class="col-md-4 mb-3">
					<label class="form-label">Product</label>
					<select class="form-select" name="product" id="product">
						<option value="">Select Product</option>
						<option value="eggs">Eggs</option>
						<option value="birds">Off Layer Birds</option>
						<option value="manure">Manure</option>
					</select>
				</div>

				<div class="col-md-4 mb-3">
					<label class="form-label">Quantity</label>
					<input type="number" class="form-control" id="quantity" name="quantity" min="0" step="1" value="0">
				</div>

				<div class="col-md-4 mb-3">
					<label class="form-label">Price per Unit</label>
					<input type="number" class="form-control" id="price" name="price" min="0" step="0.01" value="0">
				</div>

				<!-- CALCULATIONS -->
				<div class="col-md-4 mb-3">
					<label class="form-label">Total Amount</label>
					<input type="text" class="form-control" id="total" name="total" readonly value="0.00">
				</div>

				<div class="col-md-4 mb-3">
					<label class="form-label">Deposit Paid</label>
					<input type="number" class="form-control" id="deposit" name="deposit" min="0" step="0.01" value="0">
				</div>

				<div class="col-md-4 mb-3">
					<label class="form-label">Balance</label>
					<input type="text" class="form-control" id="balance" name="balance" readonly value="0.00">
				</div>

				<!-- PAYMENT TYPE -->
				<div class="col-md-6 mb-3">
					<label class="form-label">Payment Method</label>
					<select class="form-select" name="payment_method">
						<option>Cash</option>
						<option>Mobile Money</option>
						<option>Bank</option>
					</select>
				</div>

				<div class="col-md-6 mb-3">
					<label class="form-label">Sale Type</label>
					<select class="form-select" name="sale_type">
						<option value="instant">Instant Sale</option>
						<option value="booking">Booking (Future Delivery)</option>
					</select>
				</div>

				<!-- BOOKING DATE -->
				<div class="col-md-6 mb-3">
					<label class="form-label">Delivery Date (For Bookings)</label>
					<input type="date" class="form-control" name="delivery_date">
				</div>

				<div class="col-md-12 mb-3">
					<label class="form-label">Notes</label>
					<textarea class="form-control" name="notes"></textarea>
				</div>

			</div>

			<button type="submit" class="btn btn-success w-100" id="completeSaleBtn">
				Complete Sale
			</button>

		</form>

	</div>
</div>

</div>


{% endblock %}

{% block extra_js %}
<script>
(() => {
	const $ = id => document.getElementById(id);
	const qEl = $('quantity');
	const pEl = $('price');
	const dEl = $('deposit');
	const totalEl = $('total');
	const balanceEl = $('balance');

	function toNum(v){ return isNaN(v) ? 0 : Number(v); }

	function recalc(){
		const q = toNum(qEl.value);
		const p = toNum(pEl.value);
		const d = toNum(dEl.value);
		const total = q * p;
		const balance = total - d;
		totalEl.value = total.toFixed(2);
		// show negative balances as negative (manager may allow credit)
		balanceEl.value = balance.toFixed(2);
	}

	[qEl,pEl,dEl].forEach(el => el && el.addEventListener('input', recalc));

	// init
	document.addEventListener('DOMContentLoaded', recalc);
})();
</script>
{% endblock %}
